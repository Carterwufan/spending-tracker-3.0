services:
  - type: web
    name: spending-tracker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/expenses.db
    disk:
      name: spending-tracker-data
      mountPath: /var/data
      sizeGB: 1
