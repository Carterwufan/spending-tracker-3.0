<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spending Tracker</title>
  <meta name="theme-color" content="#1f6f54">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spending Tracker">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header>
    <h1>Spending Tracker</h1>
    <form method="post" action="{{ url_for('logout') }}">
      <button class="quiet">Log out</button>
    </form>
  </header>

  <section aria-labelledby="summary-title">
    <h2 id="summary-title">Monthly comparison</h2>
    <label class="month-picker">Month
      <input id="month" type="month" required>
    </label>
    <div class="summary-grid" aria-live="polite">
      <article class="summary-card">
        <p class="muted">Income</p>
        <p id="income-total" class="summary-amount">$0.00</p>
        <small id="income-compare" class="muted"></small>
      </article>
      <article class="summary-card">
        <p class="muted">Spent</p>
        <p id="spent-total" class="summary-amount">$0.00</p>
        <small id="spent-compare" class="muted"></small>
      </article>
      <article class="summary-card">
        <p class="muted">Net</p>
        <p id="net-total" class="summary-amount">$0.00</p>
        <small id="net-compare" class="muted"></small>
      </article>
    </div>
    <h3 class="subheading">Spending by category</h3>
    <ul id="by-category" class="ledger"></ul>
  </section>

  <section aria-labelledby="add-title">
    <h2 id="add-title">Add a transaction</h2>
    <form id="add-form" autocomplete="off">
      <label>Type
        <select id="type" required>
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </label>
      <label>Category
        <input id="category" list="categories" required maxlength="50">
      </label>
      <datalist id="categories"></datalist>
      <label>Amount
        <input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required>
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
      <label>Note (optional)
        <input id="note" maxlength="200">
      </label>
      <button type="submit">Add transaction</button>
    </form>
    <p id="msg" role="status"></p>
  </section>

  <section aria-labelledby="list-title">
    <h2 id="list-title">All transactions</h2>
    <ul id="list" class="ledger"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const money = (n) => n.toLocaleString(undefined, { style: "currency", currency: "USD" });

function localToday() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function show(text, isError = false) {
  const el = $("msg");
  el.textContent = text;
  el.className = isError ? "error" : "muted";
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 401) {
    location.href = "/login";
    throw new Error("Please log in again.");
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function line(left, sub, amount, extra, amountClass = "") {
  const li = document.createElement("li");
  const info = document.createElement("div");
  const name = document.createElement("span");
  name.textContent = left;
  info.append(name);
  if (sub) {
    const small = document.createElement("small");
    small.textContent = sub;
    info.append(small);
  }
  const amt = document.createElement("span");
  amt.className = `amount ${amountClass}`;
  amt.textContent = money(amount);
  li.append(info, amt);
  if (extra) li.append(extra);
  return li;
}

function transactionRow(e) {
  const del = document.createElement("button");
  del.className = "quiet danger";
  del.textContent = "Remove";
  del.setAttribute(
    "aria-label",
    `Remove ${e.category} ${e.type} of ${money(e.amount)}`
  );
  del.onclick = async () => {
    if (!confirm(`Remove ${e.type}: ${e.category} (${money(e.amount)})?`)) return;
    try {
      await api(`/api/expenses/${e.id}`, { method: "DELETE" });
      show("Transaction removed.");
      await refresh();
    } catch (err) { show(err.message, true); }
  };
  const sign = e.type === "income" ? "+" : "−";
  const li = line(
    `${e.category} · ${e.type}`,
    e.note ? `${e.date}, ${e.note}` : e.date,
    e.amount,
    del,
    e.type === "income" ? "positive" : "negative"
  );
  li.querySelector(".amount").textContent = `${sign}${money(e.amount)}`;
  return li;
}

function monthLabel(month) {
  return new Date(`${month}-01T00:00:00`).toLocaleDateString(undefined, {
    month: "long",
    year: "numeric",
  });
}

function comparisonText(previousAmount, currentAmount, previousMonth) {
  const difference = currentAmount - previousAmount;
  let change;
  if (difference === 0) {
    change = "no change";
  } else {
    change = `${difference > 0 ? "up" : "down"} ${money(Math.abs(difference))}`;
  }
  return `${monthLabel(previousMonth)}: ${money(previousAmount)} · ${change}`;
}

function renderSummary(summary) {
  const previousMonth = summary.previous_month;
  $("income-total").textContent = money(summary.current.income);
  $("spent-total").textContent = money(summary.current.expenses);
  $("net-total").textContent = money(summary.current.net);
  $("income-compare").textContent = comparisonText(
    summary.previous.income, summary.current.income, previousMonth
  );
  $("spent-compare").textContent = comparisonText(
    summary.previous.expenses, summary.current.expenses, previousMonth
  );
  $("net-compare").textContent = comparisonText(
    summary.previous.net, summary.current.net, previousMonth
  );
  $("by-category").replaceChildren(
    ...summary.by_category.map((c) => line(c.category, "", c.total))
  );
  if (!summary.by_category.length) {
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "No expenses recorded for this month.";
    $("by-category").replaceChildren(li);
  }
}

async function refresh() {
  const [data, summary] = await Promise.all([
    api("/api/expenses"),
    api(`/api/monthly-summary?month=${encodeURIComponent($("month").value)}`),
  ]);
  renderSummary(summary);
  $("categories").replaceChildren(
    ...data.by_category.map((c) => {
      const o = document.createElement("option");
      o.value = c.category;
      return o;
    })
  );
  if (data.transactions.length) {
    $("list").replaceChildren(...data.transactions.map(transactionRow));
  } else {
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "No transactions yet. Add your first one above.";
    $("list").replaceChildren(li);
  }
}

$("month").value = localToday().slice(0, 7);
$("month").addEventListener("change", () => {
  refresh().catch((err) => show(err.message, true));
});

$("add-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try {
    await api("/api/expenses", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: $("type").value,
        category: $("category").value,
        amount: $("amount").value,
        date: $("date").value,
        note: $("note").value,
      }),
    });
    $("category").value = "";
    $("amount").value = "";
    $("note").value = "";
    show("Transaction added.");
    await refresh();
    $("category").focus();
  } catch (err) { show(err.message, true); }
});

$("date").value = localToday();
refresh().catch((err) => show(err.message, true));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch((err) => {
      console.error("Could not register the service worker:", err);
    });
  });
}
</script>
</body>
</html>
