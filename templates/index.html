<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spending Tracker</title>
  <meta name="theme-color" content="#1f6f54">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spending Tracker">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <script src="{{ url_for('static', filename='consent.js') }}"></script>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
<main>
  <header>
    <h1>Spending Tracker</h1>
    <details class="profile-menu">
      <summary aria-label="Account options">
        <span class="profile-icon" aria-hidden="true"></span>
      </summary>
      <div class="profile-dropdown">
        <button id="theme-toggle" class="menu-item" type="button"></button>
        <a class="menu-item" href="{{ url_for('account') }}">Account &amp; privacy</a>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="menu-item" type="submit">Log out</button>
        </form>
      </div>
    </details>
  </header>

  <section aria-labelledby="summary-title">
    <div class="comparison-controls">
      <h2 id="summary-title">Monthly comparison</h2>
      <label class="month-picker">Month
        <input id="month" type="month" required>
      </label>
    </div>
    <div class="summary-grid" aria-live="polite">
      <article class="summary-card">
        <p class="muted">Income</p>
        <p id="income-total" class="summary-amount">$0.00</p>
        <small id="income-compare" class="muted"></small>
      </article>
      <article class="summary-card">
        <p class="muted">Spent</p>
        <p id="spent-total" class="summary-amount">$0.00</p>
        <small id="spent-compare" class="muted"></small>
      </article>
      <article class="summary-card">
        <p class="muted">Net</p>
        <p id="net-total" class="summary-amount">$0.00</p>
        <small id="net-compare" class="muted"></small>
      </article>
    </div>
    <h3 class="subheading">Spending by category</h3>
    <ul id="by-category" class="ledger"></ul>
  </section>

  <section aria-labelledby="add-title">
    <h2 id="add-title">Add a transaction</h2>
    <form id="add-form" autocomplete="off">
      <label>Type
        <select id="type" required>
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </label>
      <label>Category
        <input id="category" list="categories" required maxlength="50">
      </label>
      <datalist id="categories"></datalist>
      <label>Amount
        <input id="amount" type="text" inputmode="numeric" placeholder="0.00" required aria-describedby="amount-hint">
        <small id="amount-hint" class="field-hint">Enter digits as cents (123 becomes $1.23).</small>
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
      <label>Note (optional)
        <input id="note" maxlength="200">
      </label>
      <button type="submit">Add transaction</button>
    </form>
    <p id="msg" role="status"></p>
  </section>

  <section aria-labelledby="list-title">
    <h2 id="list-title">All transactions</h2>
    <ul id="list" class="ledger"></ul>
  </section>
</main>

{% include "_site_footer.html" %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='register-sw.js') }}"></script>
</body>
</html>
