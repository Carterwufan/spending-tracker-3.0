<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Spending Tracker</title>
  <meta name="theme-color" content="#1f6f54">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header><h1>Spending Tracker</h1></header>
  <section>
    <h2>Reset your password</h2>
    <p class="muted auth-description">Enter your account email. If it matches an account, we will email a one-time link.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email
        <input type="email" name="email" required maxlength="254" autocomplete="email">
      </label>
      {% if message %}<p class="muted" role="status">{{ message }}</p>{% endif %}
      <button type="submit">Send reset link</button>
    </form>
    <nav class="auth-links" aria-label="Account">
      <a href="{{ url_for('login') }}">Back to log in</a>
    </nav>
  </section>
</main>
</body>
</html>
