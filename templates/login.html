<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Spending Tracker</title>
  <meta name="theme-color" content="#1f6f54">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spending Tracker">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <script src="{{ url_for('static', filename='consent.js') }}"></script>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header><h1>Spending Tracker</h1></header>
  <section>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email
        <input type="email" name="email" required autofocus maxlength="254" autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      {% if notice %}<p class="muted" role="status">{{ notice }}</p>{% endif %}
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button type="submit">Log in</button>
    </form>
    <nav class="auth-links" aria-label="Account">
      {% if allow_registration %}<a href="{{ url_for('register') }}">Create an account</a>{% endif %}
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
    </nav>
  </section>
</main>
{% include "_site_footer.html" %}
<script src="{{ url_for('static', filename='register-sw.js') }}"></script>
</body>
</html>
